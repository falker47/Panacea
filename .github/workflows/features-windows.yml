name: Windows features

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  startup-roundtrip:
    name: Disposable HKCU startup approval round trip
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PANACEA_ALLOW_HOSTED_PROBE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source and hosted Windows environment
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SOURCE_SHA) { throw "Unexpected source revision" }
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows' -or $env:PANACEA_ALLOW_HOSTED_PROBE -ne 'true') { throw "Authorized disposable Windows runner required" }
          "Verified source: $actual; event: $env:GITHUB_EVENT_NAME" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Toggle, verify and remove the unique dummy HKCU entry
        env:
          PANACEA_FEATURE_STARTUP_FIXTURE: '1'
        run: python -m pytest -q tests/test_startup_apps.py::test_disposable_hkcu_round_trip
