name: Panacea Qt Quick Lab

# The trial is intentionally outside stable release/update workflows.
on:
  push:
    branches:
      - experiment/qt-quick-navigation-20261029
    paths:
      - 'qt_lab/**'
      - '.github/workflows/qt-lab.yml'
  pull_request:
    paths:
      - 'qt_lab/**'
      - '.github/workflows/qt-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panacea-qt-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-qt-lab:
    name: Windows GUI A/B (read-only)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            qt_lab/requirements.txt

      - name: Install stable + isolated experiment dependencies
        run: python -m pip install -r requirements.txt -r qt_lab/requirements.txt

      - name: Syntax and contract checks
        run: |
          python -m compileall -q qt_lab/main.py qt_lab/tests
          python -m unittest discover -s qt_lab/tests -p "test_*.py" -v

      - name: Read-only CustomTkinter comparison in the same runner
        shell: pwsh
        run: |
          python scripts/perf_pass.py --samples 5 --output build/qt-lab/tk-classic.json
          if ($LASTEXITCODE -ne 0) { throw "Stable Panacea baseline failed" }

      - name: Qt Quick source smoke and screenshot
        shell: pwsh
        run: |
          python qt_lab/main.py --smoke-test --report build/qt-lab/qt-source.json --capture build/qt-lab/qt-source.png
          if ($LASTEXITCODE -ne 0) { throw "Qt Quick source smoke failed" }

      - name: Build isolated non-installed Windows package
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name PanaceaQtLab --add-data "qt_lab/Main.qml;qt_lab" --collect-all PySide6 qt_lab/main.py
          if ($LASTEXITCODE -ne 0) { throw "Qt Lab package build failed" }
          if (-not (Test-Path "dist/PanaceaQtLab/PanaceaQtLab.exe")) { throw "Qt Lab executable missing" }

      - name: Packaged GUI smoke and screenshot
        shell: pwsh
        run: |
          & "dist/PanaceaQtLab/PanaceaQtLab.exe" --smoke-test --report "build/qt-lab/qt-packaged.json" --capture "build/qt-lab/qt-packaged.png"
          if ($LASTEXITCODE -ne 0) { throw "Qt Lab package smoke failed" }

      - name: Package the portable QA folder with checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/PanaceaQtLab" -DestinationPath "build/qt-lab/PanaceaQtLab-Windows.zip" -Force
          $hash = (Get-FileHash -LiteralPath "build/qt-lab/PanaceaQtLab-Windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PanaceaQtLab-Windows.zip" | Set-Content -LiteralPath "build/qt-lab/PanaceaQtLab-Windows.zip.sha256" -Encoding utf8

      - name: Retain baseline and Qt screenshots/measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Panacea-Qt-Lab-evidence
          path: |
            build/qt-lab/*.json
            build/qt-lab/*.png
          if-no-files-found: warn

      - name: Deliver separate QA ZIP only after packaged smoke
        uses: actions/upload-artifact@v4
        with:
          name: Panacea-Qt-Lab-portable-Windows
          path: |
            build/qt-lab/PanaceaQtLab-Windows.zip
            build/qt-lab/PanaceaQtLab-Windows.zip.sha256
          if-no-files-found: error
