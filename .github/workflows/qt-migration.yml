name: Panacea Qt Migration QA

on:
  push:
    branches: [feat/panacea-qt-migration-20261029]
    paths:
      - 'qt_app/**'
      - '.github/workflows/qt-migration.yml'
  pull_request:
    paths:
      - 'qt_app/**'
      - '.github/workflows/qt-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panacea-qt-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ui-and-contracts:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            qt_lab/requirements.txt

      - name: Install test and Qt runtime
        run: python -m pip install -r requirements-dev.txt -r qt_lab/requirements.txt

      - name: Check read-only API contract and syntax
        run: |
          python -m unittest discover -s qt_app/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Qt contract tests failed" }
          python -m ruff check qt_app
          if ($LASTEXITCODE -ne 0) { throw "Qt Ruff checks failed" }
          python -m compileall -q qt_app
          if ($LASTEXITCODE -ne 0) { throw "Qt compilation failed" }

      - name: Qt migration shell source smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/qt-app | Out-Null
          python -c "import subprocess,sys; subprocess.run([sys.executable, 'qt_app/main.py', '--smoke-test', '--capture', 'build/qt-app/source.png'], check=True, timeout=45)"
          if ($LASTEXITCODE -ne 0) { throw "Qt migration source smoke failed" }
          if (-not (Test-Path -LiteralPath "build/qt-app/source.png") -or (Get-Item "build/qt-app/source.png").Length -lt 1024) { throw "Qt source screenshot was not captured" }

      - name: Capture V2 visual review matrix (safe Qt mode, no maintenance)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($size in @(@{ w=1366; h=768 }, @{ w=1920; h=1080 })) {
            foreach ($scale in @("1", "1.25", "1.5")) {
              $env:QT_SCALE_FACTOR = $scale
              $percent = [int]([double]::Parse($scale, [System.Globalization.CultureInfo]::InvariantCulture) * 100)
              $factor = [double]::Parse($scale, [System.Globalization.CultureInfo]::InvariantCulture)
              $logicalW = [int][math]::Round($size.w / $factor)
              $logicalH = [int][math]::Round($size.h / $factor)
              foreach ($tab in @(0,1,2,3,4)) {
                $file = "build/qt-app/matrix-$($size.w)x$($size.h)-$percent-tab$tab-it.png"
                python qt_app/main.py --smoke-test --smoke-width $logicalW --smoke-height $logicalH --smoke-tab $tab --smoke-language it --capture $file
                if ($LASTEXITCODE -ne 0) { throw "Qt matrix failed: $file" }
              }
            }
          }
          $env:QT_SCALE_FACTOR = "1"
          foreach ($tab in @(0,1,2,3,4)) {
            $file = "build/qt-app/english-1366x768-tab$tab.png"
            python qt_app/main.py --smoke-test --smoke-width 1366 --smoke-height 768 --smoke-tab $tab --smoke-language en --capture $file
            if ($LASTEXITCODE -ne 0) { throw "English Qt page failed: $file" }
          }
          python qt_app/visual_review.py --captures build/qt-app --baseline docs/validation/screenshots --out build/qt-app
          if ($LASTEXITCODE -ne 0) { throw "V2 visual comparison report failed" }

      - name: Package independent candidate, not stable release
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name PanaceaQtCandidate --add-data "qt_app/Main.qml;qt_app" --add-data "qt_app/ParityPage.qml;qt_app" --add-data "assets/panacea_icon.png;assets" --add-data "assets/icons/lucide/png;assets/icons/lucide/png" --hidden-import modules.restore --hidden-import modules.performance --hidden-import modules.maintenance_guard --hidden-import modules.disk --hidden-import modules.cleanup qt_app/main.py
          if ($LASTEXITCODE -ne 0) { throw "Qt migration build failed" }
          if (-not (Test-Path "dist/PanaceaQtCandidate/PanaceaQtCandidate.exe")) { throw "Qt candidate EXE missing" }

      - name: Remove unused Qt web runtimes
        shell: pwsh
        run: |
          $root = "dist/PanaceaQtCandidate/_internal/PySide6"
          foreach ($dll in @("Qt6WebEngineCore.dll", "Qt6WebEngineQuick.dll", "Qt6WebEngineQuickDelegatesQml.dll", "Qt6WebView.dll", "Qt6WebViewQuick.dll")) {
            $path = Join-Path $root $dll
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
          foreach ($folder in @("QtWebEngine", "QtWebView")) {
            $path = Join-Path "$root/qml" $folder
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force -Recurse }
          }
          if (-not (Test-Path -LiteralPath "$root/Qt6Quick.dll")) { throw "Required QtQuick DLL missing" }

      - name: Verify packaged maintenance imports (no Windows operations)
        shell: pwsh
        run: |
          python -c "import subprocess; subprocess.run(['dist/PanaceaQtCandidate/PanaceaQtCandidate.exe', '--smoke-backend-imports'], check=True, timeout=40)"
          if ($LASTEXITCODE -ne 0) { throw "Qt package is missing a maintenance backend" }

      - name: Packaged Qt UI smoke and screenshot
        shell: pwsh
        run: |
          python -c "import subprocess; subprocess.run(['dist/PanaceaQtCandidate/PanaceaQtCandidate.exe', '--smoke-test', '--capture', 'build/qt-app/packaged.png'], check=True, timeout=45)"
          if ($LASTEXITCODE -ne 0) { throw "Packaged Qt migration shell failed" }
          if (-not (Test-Path -LiteralPath "build/qt-app/packaged.png") -or (Get-Item "build/qt-app/packaged.png").Length -lt 1024) { throw "Packaged Qt screenshot was not captured" }

      - name: Measure binary size and package QA artifact
        shell: pwsh
        run: |
          $totalBytes = (Get-ChildItem "dist/PanaceaQtCandidate" -File -Recurse | Measure-Object -Property Length -Sum).Sum
          Compress-Archive -Path "dist/PanaceaQtCandidate" -DestinationPath "build/qt-app/PanaceaQtCandidate-Windows.zip" -Force
          $zipBytes = (Get-Item "build/qt-app/PanaceaQtCandidate-Windows.zip").Length
          $sha = (Get-FileHash "build/qt-app/PanaceaQtCandidate-Windows.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  PanaceaQtCandidate-Windows.zip" | Set-Content -LiteralPath "build/qt-app/PanaceaQtCandidate-Windows.zip.sha256" -Encoding utf8
          Write-Output "CANDIDATE_ZIP_SHA256=$sha"
          @{ uncompressed_bytes = [long]$totalBytes; zipped_bytes = [long]$zipBytes; maintenance_enabled = $true } |
            ConvertTo-Json | Set-Content "build/qt-app/size.json" -Encoding utf8

      - name: Retain QA logs/screenshots, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Panacea-Qt-Migration-Evidence
          path: |
            build/qt-app/*.png
            build/qt-app/*.jpg
            build/qt-app/*.json
          if-no-files-found: warn

      - name: Deliver Qt candidate only after all checks pass
        uses: actions/upload-artifact@v4
        with:
          name: Panacea-Qt-Migration-Candidate
          path: |
            build/qt-app/PanaceaQtCandidate-Windows.zip
            build/qt-app/PanaceaQtCandidate-Windows.zip.sha256
          if-no-files-found: error

  windows-qa-installer:
    name: Separate QA installer and uninstall (disposable Windows)
    needs: windows-ui-and-contracts
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Panacea-Qt-Migration-Candidate
          path: build/qt-download

      - name: Verify QA candidate archive before building installer
        shell: pwsh
        run: |
          $zip = "build/qt-download/PanaceaQtCandidate-Windows.zip"
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = (Get-Content -LiteralPath "$zip.sha256" -Raw).Trim()
          if ($manifest -cne "$actual  PanaceaQtCandidate-Windows.zip") { throw "QA archive SHA-256 mismatch" }
          Expand-Archive -LiteralPath $zip -DestinationPath "build/qt-extracted" -Force
          if (-not (Test-Path "build/qt-extracted/PanaceaQtCandidate/PanaceaQtCandidate.exe")) { throw "Verified QA bundle has no EXE" }

      - name: Build isolated Inno Setup QA installer (never stable)
        shell: pwsh
        run: |
          $programFiles32 = [Environment]::GetFolderPath("ProgramFilesX86")
          $iscc = Join-Path $programFiles32 "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler is unavailable" }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe missing" }
          $app = (Resolve-Path "build/qt-extracted/PanaceaQtCandidate").Path
          $output = (New-Item -ItemType Directory -Force "build/qt-installer").FullName
          & $iscc /Qp "/DQtCandidateDir=$app" "/DQtOutputDir=$output" "qt_app/packaging/PanaceaQtQA.iss"
          if ($LASTEXITCODE -ne 0) { throw "Qt QA installer build failed" }
          $setup = "build/qt-installer/PanaceaQtQASetup.exe"
          if (-not (Test-Path $setup) -or (Get-Item $setup).Length -lt 1000000) { throw "QA installer is absent or too small" }
          $sha = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  PanaceaQtQASetup.exe" | Set-Content -LiteralPath "$setup.sha256" -Encoding ascii
          Write-Output "QA_INSTALLER_SHA256=$sha"

      - name: Install, smoke and uninstall QA app side-by-side
        shell: pwsh
        run: |
          $setup = (Resolve-Path "build/qt-installer/PanaceaQtQASetup.exe").Path
          $target = Join-Path $env:RUNNER_TEMP ("PanaceaQtQA-" + [guid]::NewGuid().ToString("N"))
          # GUI installers launched with & can detach before PowerShell reads LASTEXITCODE.
          # Inno still shows the startup prompt under /VERYSILENT unless /SP- is supplied.
          $installLog = Join-Path (Resolve-Path "build/qt-installer").Path "qa-install.log"
          $arguments = @("/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$target`"", "/LOG=`"$installLog`"")
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $installLog) { Get-Content $installLog -Tail 80 }
            throw "Qt QA installer failed (Inno exit code $($process.ExitCode))"
          }
          $exe = Join-Path $target "PanaceaQtCandidate.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Qt QA installed EXE missing" }
          $capture = Join-Path (Resolve-Path "build/qt-installer").Path "installed.png"
          python -c "import subprocess,sys; subprocess.run([sys.argv[1], '--smoke-test', '--capture', sys.argv[2]], check=True, timeout=60)" $exe $capture
          if ($LASTEXITCODE -ne 0) { throw "Installed Qt QA startup failed" }
          if (-not (Test-Path $capture) -or (Get-Item $capture).Length -lt 1024) { throw "Installed Qt screenshot missing" }
          $uninstall = Join-Path $target "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstall)) { throw "Isolated QA uninstaller missing" }
          $uninstallLog = Join-Path (Resolve-Path "build/qt-installer").Path "qa-uninstall.log"
          $removed = Start-Process -FilePath $uninstall -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$uninstallLog`"") -Wait -PassThru
          if ($removed.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $uninstallLog) { Get-Content $uninstallLog -Tail 80 }
            throw "QA uninstaller failed (exit code $($removed.ExitCode))"
          }
          if (Test-Path -LiteralPath $exe) { throw "QA uninstaller left executable behind" }

      - name: Save QA installer smoke screenshot, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Panacea-Qt-QA-Installer-Evidence
          path: |
            build/qt-installer/installed.png
            build/qt-installer/qa-install.log
            build/qt-installer/qa-uninstall.log
          if-no-files-found: warn

      - name: Deliver side-by-side QA installer only after all checks pass
        uses: actions/upload-artifact@v4
        with:
          name: Panacea-Qt-QA-Installer
          path: |
            build/qt-installer/PanaceaQtQASetup.exe
            build/qt-installer/PanaceaQtQASetup.exe.sha256
          if-no-files-found: error

  windows-onefile-update-compatibility:
    name: Prove production executable identity without publishing
    needs: windows-ui-and-contracts
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            qt_lab/requirements.txt

      - name: Install Qt and packaging dependencies
        run: python -m pip install -r requirements-dev.txt -r qt_lab/requirements.txt

      - name: Build disposable Qt one-file Panacea.exe for updater identity tests
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Panacea --add-data "qt_app/Main.qml;qt_app" --add-data "qt_app/ParityPage.qml;qt_app" --add-data "assets/panacea_icon.png;assets" --add-data "assets/icons/lucide/png;assets/icons/lucide/png" --hidden-import modules.restore --hidden-import modules.performance --hidden-import modules.maintenance_guard --hidden-import modules.disk --hidden-import modules.cleanup --hidden-import modules.updater --hidden-import modules.update_install qt_app/main.py
          if ($LASTEXITCODE -ne 0) { throw "Qt one-file production-identity prototype could not be built" }
          if (-not (Test-Path -LiteralPath "dist/Panacea.exe")) { throw "Qt one-file executable is missing" }

      - name: Verify frozen helper imports and full Qt startup in isolated runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "build/qt-onefile" | Out-Null
          python -c "import subprocess; subprocess.run(['dist/Panacea.exe', '--smoke-backend-imports'], check=True, timeout=90)"
          if ($LASTEXITCODE -ne 0) { throw "One-file backend imports failed" }
          python -c "import subprocess; subprocess.run(['dist/Panacea.exe', '--smoke-test', '--capture', 'build/qt-onefile/panacea.png'], check=True, timeout=90)"
          if ($LASTEXITCODE -ne 0) { throw "One-file source UI smoke failed" }
          if ((Get-Item "build/qt-onefile/panacea.png").Length -lt 1024) { throw "Qt one-file GUI did not render" }
          $size = (Get-Item "dist/Panacea.exe").Length
          $digest = (Get-FileHash "dist/Panacea.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "ONEFILE_QT_BYTES=$size"
          Write-Output "ONEFILE_QT_SHA256=$digest"
          @{ bytes = [long]$size; sha256 = $digest; release_candidate = $false; installer_compatible = $false } |
            ConvertTo-Json | Set-Content "build/qt-onefile/identity.json" -Encoding utf8

      - name: Retain one-file experiment evidence only, never deliver a release exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Panacea-Qt-OneFile-Compatibility-Evidence
          path: |
            build/qt-onefile/panacea.png
            build/qt-onefile/identity.json
          if-no-files-found: warn
