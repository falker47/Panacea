name: Prepare Windows release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed source commit SHA (40 hexadecimal characters)
        required: true
        type: string
      tag:
        description: Exact version tag matching version.py (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: panacea-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Require immutable source
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ($env:SOURCE_REF -notmatch '^[a-fA-F0-9]{40}$') { throw 'An exact reviewed commit SHA is required' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Check the source before running code that will receive signing credentials
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ secrets.PANACEA_SIGN_PFX_BASE64 != '' || secrets.PANACEA_SIGN_PASSWORD != '' || secrets.PANACEA_SIGN_TIMESTAMP_URL != '' }}
        run: |
          if ($env:SIGNING_CONFIGURED -eq 'true') {
            if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Signing requires hosted main' }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Sign only a reviewed source commit on main' }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Check version and tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release_tools.py --tag "$env:RELEASE_TAG"
      - run: python -m ruff check .
      - run: python -m pytest -q tests
      - run: python -m unittest discover -s qt_app/tests -p "test_*.py" -v
      - run: python -m compileall -q main.py panacea_ui.py version.py modules qt_app scripts
      - run: python -c "import qt_app.main, modules.updater, modules.update_install"
      - run: python scripts/build.py --defer-checksum
      - name: Optionally sign and checksum the portable before building Setup
        env:
          PANACEA_ALLOW_HOSTED_PROBE: 'true'
          PANACEA_SIGN_PFX_BASE64: ${{ secrets.PANACEA_SIGN_PFX_BASE64 }}
          PANACEA_SIGN_PASSWORD: ${{ secrets.PANACEA_SIGN_PASSWORD }}
          PANACEA_SIGN_TIMESTAMP_URL: ${{ secrets.PANACEA_SIGN_TIMESTAMP_URL }}
        run: python scripts/release_tools.py --finalize dist/Panacea.exe
      - name: Verify Qt version and packaged backend and startup
        shell: pwsh
        run: |
          $version = python scripts/release_tools.py
          if ((Get-Item 'dist\Panacea.exe').VersionInfo.ProductVersion -ne $version) { throw 'Binary version mismatch' }
          python -c "import subprocess; subprocess.run(['dist/Panacea.exe', '--smoke-backend-imports'], check=True, timeout=90)"
          if ($LASTEXITCODE -ne 0) { throw 'Qt frozen backend imports failed' }
          $process = Start-Process -FilePath 'dist\Panacea.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Packaged smoke timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged smoke failed: $($process.ExitCode)" }
      - name: Ensure Inno Setup compiler is available on the disposable runner
        shell: pwsh
        env:
          PANACEA_ALLOW_HOSTED_PROBE: ${{ github.ref == 'refs/heads/main' }}
        run: |
          $pf32 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $compiler = Join-Path $pf32 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:PANACEA_ALLOW_HOSTED_PROBE -ne 'true') { throw 'Inno installation requires an authorized hosted runner' }
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'ISCC.exe is missing' }
          "PANACEA_ISCC=$compiler" >> $env:GITHUB_ENV

      - name: Build checksum-verified per-machine installer
        shell: pwsh
        run: |
          python scripts/build_installer.py --iscc "$env:PANACEA_ISCC" --exe dist/Panacea.exe --checksum dist/Panacea.exe.sha256 --out dist
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Optionally sign Setup and regenerate its checksum
        shell: pwsh
        env:
          PANACEA_ALLOW_HOSTED_PROBE: 'true'
          PANACEA_SIGN_PFX_BASE64: ${{ secrets.PANACEA_SIGN_PFX_BASE64 }}
          PANACEA_SIGN_PASSWORD: ${{ secrets.PANACEA_SIGN_PASSWORD }}
          PANACEA_SIGN_TIMESTAMP_URL: ${{ secrets.PANACEA_SIGN_TIMESTAMP_URL }}
        run: |
          python scripts/release_tools.py --finalize dist/PanaceaSetup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Setup finalization failed' }
          $actual = (Get-FileHash -LiteralPath dist/PanaceaSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = (Get-Content -LiteralPath dist/PanaceaSetup.exe.sha256 -Raw).Trim()
          if ($manifest -cne "$actual  PanaceaSetup.exe") { throw 'Setup SHA-256 mismatch' }

      - uses: actions/upload-artifact@v4
        with:
          name: Panacea-release-assets
          path: |
            dist/Panacea.exe
            dist/Panacea.exe.sha256
            dist/PanaceaSetup.exe
            dist/PanaceaSetup.exe.sha256
            dist/release-notes.md
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Panacea-release-assets
          path: assets
      - name: Create reviewable draft with binary assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          gh release create "$RELEASE_TAG" --draft --target "$SOURCE_REF" --title "Panacea $RELEASE_TAG" --notes-file assets/release-notes.md assets/Panacea.exe
          for asset in Panacea.exe.sha256 PanaceaSetup.exe PanaceaSetup.exe.sha256; do
            gh release upload "$RELEASE_TAG" "assets/$asset"
          done
      - name: Verify all four draft assets exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets --jq 'select(.isDraft == true and ([.assets[].name] | index("Panacea.exe")) != null and ([.assets[].name] | index("Panacea.exe.sha256")) != null and ([.assets[].name] | index("PanaceaSetup.exe")) != null and ([.assets[].name] | index("PanaceaSetup.exe.sha256")) != null)' > draft.json
          test -s draft.json
